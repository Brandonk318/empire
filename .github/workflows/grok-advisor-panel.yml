name: grok-advisor-panel tests
on:
  push:
    paths: ["grok-advisor-panel/**"]
  pull_request:
    paths: ["grok-advisor-panel/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grok-advisor-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
